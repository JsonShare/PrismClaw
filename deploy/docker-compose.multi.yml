# PrismClaw multi-worker production deployment.
#
# Architecture:
#   Host nginx (TLS termination + frontend + reverse proxy)
#     ├── /        → frontend/dist/ (SPA, served by nginx directly)
#     ├── /api/ws  → worker1:8000 / worker2:8000 / worker3:8000 (WebSocket)
#     ├── /api/v1/ → workers (OpenAI-compat SSE)
#     └── /api/    → workers (REST API)
#
# Workers expose ports 8001/8002/8003 on the host for nginx to proxy to.
# PostgreSQL (VectorChord Suite) and Redis run as sidecar containers.
#
# Usage:
#   cp deploy/.env.example deploy/.env
#   # edit deploy/.env — set all REQUIRED values
#   docker compose -f deploy/docker-compose.multi.yml --env-file deploy/.env up -d
#
# Host nginx reference config: deploy/nginx.conf

name: prismclaw

# ── Network isolation ──────────────────────────────────────────────────
# Internal network: workers + PG + Redis (no host exposure except worker ports)
# External network: not used (nginx runs on host)
networks:
  backend:

services:
  # ── Application workers ──────────────────────────────────────────────
  worker1: &worker
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: prismclaw:latest
    ports:
      - "127.0.0.1:8001:8000"
    environment: &worker-env
      # ── PostgreSQL ───────────────────────────────────────────────────
      # {env:} 占位符只能整值替换，DSN 在这里插值（infra.yaml 只做整值引用）。
      PRISMCLAW_STORAGE_POSTGRES_DSN: postgresql+asyncpg://prismclaw:${POSTGRES_PASSWORD}@postgres:5432/prismclaw
      # ── Redis (session / lock / affinity) ───────────────────────────
      PRISMCLAW_STORAGE_SESSION_BACKEND: redis
      PRISMCLAW_STORAGE_LOCK_BACKEND: redis
      PRISMCLAW_AFFINITY_ENABLED: "true"
      # Redis 密码：deploy/configs/infra.yaml 的 redis.password 用 {env:} 引用
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
      # ── Web channel auth ─────────────────────────────────────────────
      PRISMCLAW_WEB_JWT_SECRET: ${PRISMCLAW_WEB_JWT_SECRET:?set in deploy/.env}
      # First-run admin bootstrap (after first seed, these are ignored)
      PRISMCLAW_WEB_USER_BOOTSTRAP_ADMIN_ID: ${PRISMCLAW_WEB_USER_BOOTSTRAP_ADMIN_ID:-admin}
      PRISMCLAW_WEB_USER_BOOTSTRAP_ADMIN_PASSWORD: ${PRISMCLAW_WEB_USER_BOOTSTRAP_ADMIN_PASSWORD:?set in deploy/.env}
      # ── Production flags ─────────────────────────────────────────────
      PRISMCLAW_LOG_LEVEL: ${PRISMCLAW_LOG_LEVEL:-INFO}
      PRISMCLAW_DEPLOYMENT_ENV: production
      # ── Runtime-Agent 路由（生产强制要求，缺失则 fail-fast）───────────
      PRISMCLAW_RUNTIME_AGENT_URLS: '{"default-v1":"http://runtime-agent-default:9001","restricted-v1":"http://runtime-agent-restricted:9001"}'
      PRISMCLAW_RUNTIME_HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET in deploy/.env}
    volumes:
      - ../backend/configs:/app/backend/configs:ro
      # 容器视角覆盖：runtime/workspaces 改 /runtime、/workspace，
      # redis/postgres 改 compose 服务名（与 docker-compose.yml 一致）。
      - ./configs/server.yaml:/app/backend/configs/server.yaml:ro
      - ./configs/infra.yaml:/app/backend/configs/infra.yaml:ro
      # ★ 与 runtime-agent 同卷同路径（对称于 deploy/docker-compose.yml）
      - prismclaw-workspaces:/workspace
      - prismclaw-runtime:/runtime
      - prismclaw-home:/app/home
    networks:
      - backend
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      runtime-agent-default:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    logging: &json-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "prismclaw-{{.Name}}"
    restart: unless-stopped

  worker2:
    <<: *worker
    ports:
      - "127.0.0.1:8002:8000"

  worker3:
    <<: *worker
    ports:
      - "127.0.0.1:8003:8000"

  # ── PostgreSQL (VectorChord Suite) ───────────────────────────────────
  postgres:
    image: tensorchord/vchord-suite:pg17-latest
    # NOTE: pin to an immutable digest in production, e.g.
    #   tensorchord/vchord-suite@sha256:<digest>
    environment:
      POSTGRES_DB: prismclaw
      POSTGRES_USER: prismclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Do NOT expose PG port to host in production.
    # Access only from workers via the backend network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prismclaw", "-d", "prismclaw"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "0.5"
          memory: 1g
    command: >
      postgres
      -c shared_preload_libraries=vchord
      -c ssl=off
      -c max_connections=200
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c log_min_duration_statement=500
    logging:
      <<: *json-logging
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 0
      --tcp-keepalive 30
      --requirepass ${REDIS_PASSWORD}
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
    # Do NOT expose Redis port to host in production.
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
        reservations:
          cpus: "0.1"
          memory: 256m
    logging:
      <<: *json-logging
    restart: unless-stopped

  # ── runtime-init: 一次性对齐 runtime 卷权限 ──────────────────────────
  # 与 docker-compose.yml 同源：app（UID 10001）与两个 agent（UID 10002）
  # 共用 prismclaw-runtime；任一方先建 0755 目录都会让另一方 EPERM。
  runtime-init:
    image: alpine:3.20
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /runtime/skills/_default/site-packages
        mkdir -p /runtime/skills/_default/node_modules
        mkdir -p /runtime/cache/pip /runtime/cache/npm /runtime/cache/uv
        chmod -R a+rwX /runtime
    volumes:
      - prismclaw-runtime:/runtime
    restart: "no"

  # ── Runtime-Agent（默认沙箱）─────────────────────────────────────────
  runtime-agent-default:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime-agent
    image: prismclaw-runtime-agent:latest
    environment:
      PRISMCLAW_WORKSPACE_ROOT: /workspace
      PRISMCLAW_RUNTIME_HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET in deploy/.env}
      PRISMCLAW_RUNTIME_HMAC_KEY_VERSION: "1"
      PRISMCLAW_ALLOW_NET: "false"
    volumes:
      - prismclaw-workspaces:/workspace
      - prismclaw-runtime:/runtime
      # 只挂 assets 子目录（整个 home 含 app 专属数据，不挂给 agent）
      - type: volume
        source: prismclaw-home
        target: /app/home/.prismclaw/assets
        read_only: true
        volume:
          subpath: .prismclaw/assets
    networks:
      - backend
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9001/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    logging:
      <<: *json-logging
    restart: unless-stopped

  # ── Runtime-Agent（受限沙箱：禁网）───────────────────────────────────
  runtime-agent-restricted:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime-agent
    image: prismclaw-runtime-agent:latest
    environment:
      PRISMCLAW_WORKSPACE_ROOT: /workspace
      PRISMCLAW_RUNTIME_HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET in deploy/.env}
      PRISMCLAW_RUNTIME_HMAC_KEY_VERSION: "1"
      PRISMCLAW_ALLOW_NET: "false"
    volumes:
      - prismclaw-workspaces:/workspace
      - prismclaw-runtime:/runtime
      # 只挂 assets 子目录（同 default agent）
      - type: volume
        source: prismclaw-home
        target: /app/home/.prismclaw/assets
        read_only: true
        volume:
          subpath: .prismclaw/assets
    networks:
      - backend
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9001/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    logging:
      <<: *json-logging
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  prismclaw-workspaces:
  prismclaw-runtime:
  prismclaw-home:
