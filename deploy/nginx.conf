# PrismClaw production nginx configuration.
#
# Architecture:
#   nginx (frontend + reverse proxy + TLS termination)
#     ├── /        → frontend/dist/ (SPA static files, served directly by nginx)
#     ├── /api/ws  → upstream workers (WebSocket)
#     ├── /api/v1/ → upstream workers (OpenAI-compat SSE)
#     └── /api/    → upstream workers (REST API)
#
# Usage:
#   nginx -c /path/to/deploy/nginx.conf -p /path/to/deploy/
#
# Or include the http block contents in your existing nginx.conf.

worker_processes auto;
error_log /var/log/nginx/prismclaw-error.log warn;
pid /var/run/nginx/prismclaw.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────
    log_format with_upstream '$remote_addr - [$time_local] "$request" '
                             '$status $body_bytes_sent '
                             '-> $upstream_addr (${request_time}s) '
                             '"$http_user_agent"';
    access_log /var/log/nginx/prismclaw-access.log with_upstream;

    # ── Performance ────────────────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # ── Gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Upstream: PrismClaw workers ────────────────────────────────────
    upstream prismclaw {
        # ip_hash: same client IP → same worker (pairs with PrismClaw affinity gateway)
        ip_hash;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=2 fail_timeout=10s;
        # Single-node: replace the 3 lines above with:
        #   server 127.0.0.1:8000;
        keepalive 32;
    }

    # ── Rate limiting zones ────────────────────────────────────────────
    # General API: 30 req/s per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Login/auth: 5 req/s per IP, burst 5
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # Chat completions: 10 req/s per IP, burst 10
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;

    # ── Security headers (applied globally) ────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # ── TLS ────────────────────────────────────────────────────────
        ssl_certificate      /etc/nginx/ssl/prismclaw.crt;
        ssl_certificate_key  /etc/nginx/ssl/prismclaw.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # HSTS (6 months, include subdomains)
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

        # ── WebSocket: /api/ws ─────────────────────────────────────────
        location /api/ws {
            limit_req zone=chat_limit burst=10 nodelay;
            proxy_pass http://prismclaw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ── OpenAI-compat SSE: /api/v1/chat/completions ────────────────
        location /api/v1/ {
            limit_req zone=chat_limit burst=10 nodelay;
            proxy_pass http://prismclaw;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 600s;
        }

        # ── Auth endpoints: stricter rate limit ────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://prismclaw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Other API ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://prismclaw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check (no rate limit, no log) ──────────────────────
        location /health {
            proxy_pass http://prismclaw;
            access_log off;
        }

        # ── SPA static files (served directly by nginx) ───────────────
        # Point to the built frontend assets.
        # In Docker: mount frontend/dist/ to /var/www/prismclaw
        location / {
            root /var/www/prismclaw;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Static assets: aggressive cache (content-hashed filenames)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            # index.html: never cache (SPA entry point may change)
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # ── Deny sensitive paths ───────────────────────────────────────
        location ~ /\. { deny all; }
        location ~* /(\.env|\.git|\.htaccess) { deny all; }
    }
}
{}