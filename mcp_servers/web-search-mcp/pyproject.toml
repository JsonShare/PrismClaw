[project]
name = "web-search-mcp"
version = "0.1.0"
description = "Standalone MCP server: single search tool with built-in retrieval, fetch and extraction."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12.4,<2.0",
    "httpx>=0.27.0,<1.0",
    "markdownify>=0.11.0,<1.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "ANN001",
    "ANN201",
    "ANN202",
]
