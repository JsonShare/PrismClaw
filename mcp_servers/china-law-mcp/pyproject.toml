[project]
name = "china-law-mcp"
version = "0.2.0"
description = "MCP server over Lexifina's global-law record of Chinese law: read a provision as in force on a date, follow its history, search the text."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/china_law_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# 官方 server 的只读副本：上游代码风格与本仓库无关，不参与 lint
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
