# PrismClaw 业务域注册表 —— 唯一真实来源
#
# 编译：node scripts/compile/domains-registry.mjs
#   产出前端侧栏 / 懒加载映射、各域 _manifest_generated.py、能力开关表与部署 env。
# 裁剪：把 enabled 改为 false，或构建时传 PRISMCLAW_DOMAINS=medical。
# 新增：在 domains 下加条目，并在 backend/src/subpackages/<域> 与 frontend/subpackages/<域> 建分包。

domains:
  medical:
    enabled: true
    label: 医疗工作台

    backend_path: backend/src/subpackages/medical
    frontend_path: subpackages/medical
    # React.lazy 动态导入（Vite alias @domains → frontend/subpackages）
    lazy_import: "@domains/medical/MedicalWorkbenchPage"
    lazy_export: MedicalWorkbenchPage

    # group：侧栏分组；icon_asset：侧栏图标（相对前端分包，构建期哈希，CSS mask 跟随文字颜色）
    menus:
      - key: records
        label: 智能病历
        group: 临床业务
        icon_asset: assets/icons/records.svg
      - key: patients
        label: 患者管理
        group: 临床业务
        icon_asset: assets/icons/patients.svg
      - key: knowledge
        label: 医学知识库
        group: 临床业务
        icon_asset: assets/icons/knowledge.svg

  legal:
    enabled: true
    label: 法律工作台

    backend_path: backend/src/subpackages/legal
    frontend_path: subpackages/legal
    lazy_import: "@domains/legal/LegalWorkbenchPage"
    lazy_export: LegalWorkbenchPage

    menus:
      - key: contract
        label: 合同审查
        group: 法律合同
        icon_asset: assets/icons/contract.svg
      - key: compliance
        label: 合规检查
        group: 法律合同
        icon_asset: assets/icons/compliance.svg
